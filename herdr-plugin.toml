id = "joshbarrington.jumar"
name = "jumar"
version = "0.1.0"
min_herdr_version = "0.9.3"
platforms = ["macos", "linux"]
description = "Manage git worktrees by editing them as a text buffer, in a floating pane."

# Install downloads this platform's release binary into bin/; `plugin link` skips it.
[[build]]
platforms = ["macos", "linux"]
command = ["bash", "herdr/install.sh"]

[[panes]]
id = "pane"
# herdr requires a title, but jumar draws its own; a zero-width one shows nothing.
title = "\u200B"
placement = "popup"
width = "80%"
height = "80%"
command = ["bin/jumar"]

# For agents: the launcher in skills/jumar opens this with JUMAR_PICK_OUTPUT set.
[[panes]]
id = "pick"
title = "jumar: pick"
placement = "overlay"
command = ["bin/jumar", "pick"]

[[actions]]
id = "open"
title = "jumar: open"
contexts = ["pane", "workspace"]
command = ["bin/jumar", "--action", "open"]

[[actions]]
id = "toggle"
title = "jumar: toggle"
contexts = ["pane", "workspace"]
command = ["bin/jumar", "--action", "toggle"]
