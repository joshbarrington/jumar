[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/joshbarrington/jumar"
homepage = "https://github.com/joshbarrington/jumar"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
jumar-core = { path = "crates/jumar-core" }
clap = { version = "4.6.7", features = ["derive", "env"] }
glob = "0.3.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"

[workspace.lints.rust]
future-incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -2 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -2 }
redundant_clone = "deny"
needless_collect = "deny"
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
